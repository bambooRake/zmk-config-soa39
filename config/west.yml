manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: sekigon-gonnoc
      url-base: https://github.com/sekigon-gonnoc
    - name: gohanda11
      url-base: https://github.com/gohanda11
    - name: badjeff
      url-base: https://github.com/badjeff
    - name: iwk7273
      url-base: https://github.com/iwk7273
    - name: oleksandrmaslov
      url-base: https://github.com/oleksandrmaslov
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml
    - name: zmk-feature-non-lipo-battery-management
      remote: sekigon-gonnoc
      # main を追従しない: 2026-08-14 の 4f19488 "Fix ADC input channel definition"
      # で .input_positive が SAADC_CH_PSELP_PSELP_AnalogInput0 -> NRF_SAADC_AIN0 に
      # 変更されたが、ZMK が使う Zephyr v4.1.0+zmk-fixes には NRF_SAADC_AIN0 が
      # 存在せずビルドが落ちる (nRF54 世代の命名)。その手前の bf024bb に固定。
      # 上流が Zephyr 4.1 対応を戻したら revision: main に戻すこと。
      revision: bf024bb7872917f718a960d804136db5f9b88a31
    - name: zmk-pmw3610-driver
      remote: badjeff
      revision: main
    - name: zmk-feature-xy_clipper
      remote: iwk7273
      revision: main
    - name: zmk-ws2812-driver
      remote: gohanda11
      revision: main
    - name: zmk-pointing-acceleration
      remote: oleksandrmaslov
      revision: main
  self:
    path: config
